name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # to publish the release
  id-token: write       # to sign the build provenance (who built it, from which commit)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests (on real Windows)
        run: cargo test --workspace
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Name and checksum
        id: out
        shell: bash
        run: |
          VERSION=$(node -p "require('./app/tauri.conf.json').version")
          mkdir -p dist
          cp target/release/bundle/nsis/*-setup.exe "dist/Minimal-Download-Manager-Setup-$VERSION.exe"
          (cd dist && sha256sum Minimal-Download-Manager-Setup-*.exe | tee SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Minimal-Download-Manager-Setup
          path: dist/Minimal-Download-Manager-Setup-*.exe
          if-no-files-found: error
      # Every successful build of main publishes the installer as the release
      # for the version in app/tauri.conf.json. A published version is never
      # replaced: to ship changes, raise the version.
      - name: Check whether this version is already released
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.out.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already released and is left as it is. Raise the version in app/tauri.conf.json to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record build provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Minimal-Download-Manager-Setup-*.exe
      - name: Publish the release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.out.outputs.version }}
        run: |
          FILE="dist/Minimal-Download-Manager-Setup-$VERSION.exe"
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
          cat > notes.md <<EOF
          Download **Minimal-Download-Manager-Setup-$VERSION.exe** below and run it. Then follow *Connect your browser* in the README.

          **Check the download** (optional): in PowerShell, \`Get-FileHash .\\Minimal-Download-Manager-Setup-$VERSION.exe\` must show

          \`$HASH\`

          This file was built by GitHub Actions from commit $GITHUB_SHA. Verify with: \`gh attestation verify Minimal-Download-Manager-Setup-$VERSION.exe --owner ${{ github.repository_owner }}\`
          EOF
          gh release create "v$VERSION" "$FILE" dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "Minimal Download Manager $VERSION" --notes-file notes.md
