name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the installer to a release on version tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Engine tests (on real Windows)
        run: npm test
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Mini-IDM-Setup
          path: app/dist/Mini-IDM-Setup-*.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Mini IDM ${GITHUB_REF_NAME#v}" --notes "Download **Mini-IDM-Setup-${GITHUB_REF_NAME#v}.exe** below and run it."
          gh release upload "$GITHUB_REF_NAME" dist/Mini-IDM-Setup-*.exe --clobber
