name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the installer to a release on version tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Engine tests (on real Windows)
        run: npm test
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Mini-IDM-Setup
          path: app/dist/Mini-IDM-Setup-*.exe
          if-no-files-found: error
      # Every successful build of main publishes the installer as the release
      # for the version in app/package.json (tag v<version>, created here).
      - name: Publish the release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Mini IDM $VERSION" \
              --notes "Download **Mini-IDM-Setup-$VERSION.exe** below and run it. Windows may say the publisher is unknown: click *More info* → *Run anyway*. Then follow *Connect your browser* in the README."
          fi
          gh release upload "$TAG" dist/Mini-IDM-Setup-*.exe --clobber
