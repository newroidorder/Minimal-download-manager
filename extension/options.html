<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mini IDM settings</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
    .check input { margin-top: 3px; }
    .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 24px; }
    code { background: var(--surface); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Mini IDM settings</h1>
  <p class="muted">The server prints its URL and token when it starts (<code>npm start</code> in <code>server/</code>).</p>

  <form id="form">
    <label for="server">Server URL</label>
    <input id="server" type="url" required>

    <label for="token">Token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <p class="hint">Stored in <code>~/.mini-idm/config.json</code> on the server side.</p>

    <label class="check"><input id="captureDownloads" type="checkbox">
      <span>Take over downloads the browser starts<br><span class="hint">Hands the URL to Mini IDM, then cancels the browser download. If the server is down, the browser keeps it.</span></span>
    </label>
    <label class="check"><input id="captureClicks" type="checkbox">
      <span>Catch clicks on file links (.zip, .exe, .mp4, …)<br><span class="hint">Sends the link before the browser requests it. Useful for one-time download links.</span></span>
    </label>

    <p class="hint">Download folders, file categories and the "ask where to save" window are set in the Mini IDM app: open the server URL and click <b>Settings</b>.</p>

    <div class="actions">
      <button type="submit">Save</button>
      <button type="button" id="test" class="ghost">Test connection</button>
      <span id="result"></span>
    </div>
  </form>

  <script type="module" src="options.js"></script>
</body>
</html>
