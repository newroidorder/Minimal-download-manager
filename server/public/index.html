<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mini-idm-token" content="__TOKEN__">
  <title>Mini IDM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Mini IDM</h1>
    <div class="header-actions">
      <span id="conn" class="conn">Connecting…</span>
      <button type="button" id="toggleSettings" class="ghost">Settings</button>
    </div>
  </header>

  <form class="settings" id="settings" hidden>
    <h2>Download folders</h2>
    <p class="hint">Files are sorted into a folder by type, like IDM. Anything that doesn't match goes to General.</p>
    <div class="grid" id="catGrid">
      <span class="head">Category</span><span class="head">Folder</span><span class="head">File types</span>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="askWhereToSave"> Ask where to save each download</label>
      <label class="check"><input type="checkbox" id="showDialog"> Show progress and "download complete" window</label>
    </div>
    <div class="row">
      <label>Downloads at once <input type="number" id="maxActive" min="1" max="10"></label>
      <label>Connections per download <input type="number" id="maxConnections" min="1" max="32"></label>
    </div>
    <p class="form-error" id="settingsError" hidden></p>
    <div class="buttons">
      <button type="submit">Save settings</button>
      <span class="saved" id="settingsSaved" hidden>Saved.</span>
    </div>
  </form>

  <form id="add">
    <input id="url" type="url" required placeholder="Paste a download URL" autocomplete="off" aria-label="Download URL">
    <input id="name" type="text" placeholder="Save as (optional)" autocomplete="off" aria-label="File name">
    <button type="submit">Download</button>
  </form>
  <p id="formError" class="form-error" hidden></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>File</th><th class="w-progress">Progress</th><th>Size</th><th>Speed</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty">No downloads yet.</p>
  </div>

  <template id="rowTpl">
    <tr>
      <td class="file"><div class="name"></div><div class="src"></div></td>
      <td class="w-progress"><div class="bar"><div class="fill"></div></div><div class="pct"></div></td>
      <td class="size"></td>
      <td class="speed"></td>
      <td><span class="badge"></span><div class="err"></div></td>
      <td class="actions"></td>
    </tr>
  </template>

  <script src="/app.js"></script>
</body>
</html>
